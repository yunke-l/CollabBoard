name: Continuous integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: collabboard
          POSTGRES_PASSWORD: collabboard_local
          POSTGRES_DB: collabboard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collabboard -d collabboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://collabboard:collabboard_local@localhost:5432/collabboard_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
